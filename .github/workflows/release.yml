# Release after merging a PR labelled "release": build the Windows ZIP and publish it as a
# GitHub release (logic in scripts/release.mjs, manually: npm run release).
#
# Triggered by the push to main (not pull_request_target, which GitHub restricts on public
# repos): the merge has already happened, so only approved code on main is built. The job
# "check" looks up the PR of the pushed commit and its label (scripts/release-pr.mjs). Never
# put PR content into run: lines (only via env), otherwise title/description could inject code.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read # PR of the commit, release notes: PRs merged since the last release

# Never two releases at once (same version number)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - id: pr
        run: node scripts/release-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}

  release:
    needs: check
    if: needs.check.outputs.pr != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node scripts/release.mjs --ci
        env:
          # RELEASE_TOKEN: owner's fine-grained PAT – GitHub Actions can't be added to the
          # bypass list of the tag ruleset in a personal repo, the owner (repository admin) can
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          # Reading PRs: the PAT only has Contents permission
          GITHUB_READ_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PR: ${{ needs.check.outputs.pr }}
