appId: com.devhub.app
productName: DevHub
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Entwicklungs-Datenordner (Caches, whisper-Modell, eigener Zustand) nie mitpacken
  - '!data{,/**}'
  - '!{dist,build,.claude,scripts,.github}{,/**}'
  - '!out/THIRD_PARTY_NOTICES.txt'
  - '!LICENSE'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
electronLanguages:
  - de
  - en-US
# Programmordner als ZIP (auspacken, DevHub.exe starten): startet sofort, weil nichts
# bei jedem Start nach %TEMP% entpackt wird (anders als das portable-Ziel)
win:
  executableName: DevHub
  target:
    - zip
  artifactName: ${productName}-${version}-win.${ext}
extraFiles:
  - from: build/LIESMICH.txt
    to: LIESMICH.txt
  # Lizenz von DevHub + Lizenztexte der enthaltenen Bibliotheken (scripts/notices.mjs)
  - from: LICENSE
    to: LICENSE.txt
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
npmRebuild: false
