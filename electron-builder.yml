appId: com.devhub.app
productName: DevHub
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Never package the development data folder (caches, whisper model, own state)
  - '!data{,/**}'
  - '!{dist,build,.claude,scripts,.github}{,/**}'
  - '!out/THIRD_PARTY_NOTICES.txt'
  - '!LICENSE'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
electronLanguages:
  - de
  - en-US
# Program folder as ZIP (extract, run DevHub.exe): starts instantly because nothing is
# extracted to %TEMP% on every start (unlike the portable target)
win:
  executableName: DevHub
  target:
    - zip
  artifactName: ${productName}-${version}-win.${ext}
extraFiles:
  - from: build/LIESMICH.txt
    to: LIESMICH.txt
  # DevHub license + license texts of the included libraries (scripts/notices.mjs)
  - from: LICENSE
    to: LICENSE.txt
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
npmRebuild: false
